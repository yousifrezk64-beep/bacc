<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12332e">
<title>دراسة البكلوريا</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12332e;--cd:#1a423b;--ln:#2e5f56;--ch:#f1efe4;--dm:#a9c2ba;--rd:#e4572e;--ok:#8fd19e;--bd:#f2917a}
[data-t=light]{--bg:#f1efe4;--cd:#fff;--ln:#c9c5b0;--ch:#17332e;--dm:#5b6e68;--ok:#1f7a45;--bd:#b3402a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ch);font:17px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 90px}h1{font-size:25px;margin:6px 0}h2{font-size:19px;margin:18px 0 8px}
.sb{color:var(--dm);font-size:15px;margin:2px 0 8px}.c{background:var(--cd);border:1.5px solid var(--ln);border-radius:12px;padding:12px;margin:9px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
button{font:inherit;font-weight:600;background:var(--rd);color:#fff;border:0;border-radius:10px;padding:8px 14px;margin:2px}
button.g{background:transparent;border:1.5px solid var(--ln);color:var(--ch)}button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ch);outline-offset:2px}
input:not([type=file]):not([type=checkbox]),select{font:inherit;width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ch);margin:4px 0}
.o{display:block;width:100%;text-align:right;background:var(--bg);border:1.5px solid var(--ln);color:var(--ch);margin:7px 0;font-weight:400}
.o.ok{border-color:var(--ok);background:rgba(143,209,158,.2)}.o.bd{border-color:var(--bd);background:rgba(242,145,122,.2)}
.tag{font-size:13px;padding:1px 10px;border-radius:99px;border:1.5px solid var(--rd);color:var(--rd)}
.m{padding:10px;border-radius:10px;border:1.5px solid var(--rd);margin:9px 0}.pre{white-space:pre-wrap;margin-top:8px}
.bar{height:8px;background:var(--cd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;flex-wrap:wrap;margin:8px 0}.big{font-size:64px;font-weight:700;text-align:center;direction:ltr}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1.5px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--dm);border-radius:0;margin:0;padding:12px 4px}nav button.on{color:var(--rd)}
.card{min-height:150px;text-align:center;font-size:21px;display:flex;align-items:center;justify-content:center}
</style></head><body><div id="app"></div>
<nav id="nv"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=864e5,MAX=250000,IV=[0,1,2,4,8];
const TIPS=['ابدأ بالمادة الأصعب وأنت نشيط.','راجع درس الأمس خمس دقائق قبل الدرس الجديد.','حلّ أسئلة دورات سابقة بوقت حقيقي.','اشرح الدرس بصوت عالٍ كأنك مدرّس.','نام 7 ساعات على الأقل، الحفظ بيثبت بالنوم.','اكتب القوانين من الذاكرة ثم قارنها بالكتاب.','قسّم الدرس لأجزاء صغيرة وخذ استراحة بين كل جزء.','ركّز على أخطائك بالاختبارات أكتر من الأسئلة الصح.','أبعد الجوال عنك أثناء جلسة التركيز.','اشرب مي وتحرّك دقيقتين كل ساعة.'];
let S,v={n:'home'},msg='',Q,C,T={m:'work',end:0,left:15e5},busyAuto=0;
const PM={work:25,break:5};
function L(){let o;try{o=JSON.parse(localStorage.getItem('bacc'))}catch(e){}S={key:'',model:'gemini-2.5-flash',theme:'dark',exam:'',hours:3,pn:null,subjects:[],...(o||{})}}
function W(){try{localStorage.setItem('bacc',JSON.stringify(S));return 1}catch(e){alert('الذاكرة ممتلئة. احذف ملفاً أو استعمل ملفاً أصغر.');return 0}}
function go(n,x){v={n,...x};msg='';render();scrollTo(0,0)}
async function run(m,f){msg=m;render();try{await f();msg=''}catch(e){msg='خطأ: '+e.message}W();render()}
const ban=()=>msg?`<div class=m>${E(msg)}</div>`:'';
const prog=s=>s.lessons.length?Math.round(s.lessons.filter(l=>l.done).length/s.lessons.length*100):0;
const dueN=s=>s.cards.filter(c=>c.due<=Date.now()).length,pend=s=>s.quizzes.filter(q=>q.score==null).length;
async function ai(p,j=1){
 if(!S.key)throw Error('حط مفتاح Gemini من الإعدادات أولاً');
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent?key=${encodeURIComponent(S.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:j?{responseMimeType:'application/json',temperature:.7}:{temperature:.4}})});
 const d=await r.json();if(!r.ok)throw Error(d.error?.message||r.status);
 const t=d.candidates?.[0]?.content?.parts?.[0]?.text||'';
 return j?JSON.parse(t.replace(/```json|```/g,'').trim()):t}
function chunk(s,k){const t=s.docs.filter(d=>d.kind==k).map(d=>d.text).join(' ');if(t.length<300)throw Error(k=='exam'?'ما في ملف دورات سابقة':'ما في ملف درس');const n=5000;const a=Math.floor(Math.random()*Math.max(1,t.length-n));return t.slice(a,a+n)}
async function genQuiz(s,k='lesson'){
 const ex=k=='exam'?'النص من دورة امتحانية سابقة، فاكتب أسئلة بنفس أسلوبها ومستواها. ':'';
 const qs=(await ai(`أنت مدرّس خبير بمنهاج البكلوريا السورية، مادة ${s.name}. ${ex}من النص التالي ولّد 5 أسئلة اختيار من متعدد بالعربية، تغطي أفكاراً مختلفة، لكل سؤال 4 خيارات وإجابة صحيحة واحدة وشرح قصير، ولا تسأل عن شيء غير موجود بالنص. أرجع JSON فقط: [{"q":"..","options":["..","..","..",".."],"answer":0,"explain":".."}] حيث answer رقم الخيار الصحيح من 0 إلى 3.\n\nالنص:\n${chunk(s,k)}`)).filter(q=>q.q&&q.options&&q.options.length==4&&q.answer>=0&&q.answer<4);
 if(!qs.length)throw Error('رجعت أسئلة غير صالحة، جرّب مرة ثانية');
 s.quizzes.unshift({d:Date.now(),k,qs,score:null});if(k=='lesson')s.last=Date.now()}
async function auto(){if(busyAuto||!S.key)return;busyAuto=1;
 for(const s of S.subjects)if(Date.now()-s.last>=2*D&&s.docs.some(d=>d.kind=='lesson')){try{msg='عم أولّد اختبار '+s.name+'...';render();await genQuiz(s);msg='';W();render()}catch(e){msg='خطأ: '+e.message;render();break}}
 busyAuto=0}
async function rd(f){
 if(/\.pdf$/i.test(f.name)){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
  for(let i=1;i<=p.numPages&&t.length<MAX;i++){t+=(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+'\n'}return t}
 return f.text()}
function addSub(){const n=$('#nm').value.trim();if(!n)return alert('اكتب اسم المادة');S.subjects.push({id:Date.now(),name:n,docs:[],quizzes:[],last:0,cards:[],lessons:[]});W();go('sub',{i:S.subjects.length-1,t:'f'})}
function addDoc(i){const f=$('#fl').files[0];if(!f)return alert('اختر ملف');const k=$('#kd').value;
 run('عم أقرأ الملف...',async()=>{const t=(await rd(f)).replace(/\s+/g,' ').trim().slice(0,MAX);if(t.length<500)throw Error('ما لقيت نص كافي بالملف (ربما PDF صور ممسوحة)');S.subjects[i].docs.push({n:f.name,kind:k,text:t,sum:''})}).then(auto)}
const nq=(i,k)=>run('عم أولّد الاختبار...',()=>genQuiz(S.subjects[i],k));
const sm=(i,j)=>run('عم ألخّص...',async()=>{const d=S.subjects[i].docs[j];d.sum=await ai(`لخّص النص التالي من منهاج البكلوريا السورية (${S.subjects[i].name}) بالعربية في نقاط منظمة بعناوين، مع التعاريف والقوانين المهمة، بدون أي معلومة غير موجودة بالنص.\n\n${d.text.slice(0,30000)}`,0)});
const gc=i=>run('عم أولّد البطاقات...',async()=>{const s=S.subjects[i];const a=await ai(`من النص التالي (مادة ${s.name}) ولّد 8 بطاقات حفظ بالعربية: وجه البطاقة سؤال أو مصطلح، والظهر الجواب أو التعريف المختصر. أرجع JSON فقط: [{"f":"..","b":".."}]\n\n${chunk(s,'lesson')}`);const n=a.filter(x=>x.f&&x.b);if(!n.length)throw Error('ما رجعت بطاقات');n.forEach(x=>s.cards.push({f:x.f,b:x.b,box:0,due:0}))});
function ac(i){const f=prompt('وجه البطاقة (السؤال)');if(!f)return;const b=prompt('ظهر البطاقة (الجواب)');if(!b)return;S.subjects[i].cards.push({f,b,box:0,due:0});W();render()}
function dc(i,j){S.subjects[i].cards.splice(j,1);W();render()}
function st(i){const s=S.subjects[i];C={i,q:s.cards.map((c,j)=>j).filter(j=>s.cards[j].due<=Date.now()),flip:0,r:0};go('study',{i})}
function mk(ok){const c=S.subjects[C.i].cards[C.q[0]];if(ok){c.box=Math.min(4,c.box+1);c.due=Date.now()+IV[c.box]*D;C.r++}else{c.box=0;c.due=Date.now();C.q.push(C.q[0])}C.q.shift();C.flip=0;W();render()}
function al(i){const t=prompt('عنوان الدرس');if(t){S.subjects[i].lessons.push({t,done:0,v:''});W();render()}}
const xl=i=>run('عم أستخرج الدروس...',async()=>{const s=S.subjects[i];const a=await ai(`استخرج عناوين الدروس أو الفصول الرئيسية بالترتيب من النص التالي (مادة ${s.name}) بحد أقصى 30 عنواناً. أرجع JSON فقط: ["..",".."]\n\n${s.docs.filter(d=>d.kind=='lesson').map(d=>d.text).join(' ').slice(0,20000)}`);a.filter(x=>typeof x=='string').forEach(t=>s.lessons.push({t,done:0,v:''}))});
function tl(i,j){const l=S.subjects[i].lessons[j];l.done=l.done?0:1;W();render()}
function vd(i,j){const l=S.subjects[i].lessons[j];const u=prompt('الصق رابط فيديو الشرح (يبدأ بـ http)',l.v);if(u!==null){l.v=/^https?:\/\//.test(u.trim())?u.trim():'';W();render()}}
function dl(i,j){S.subjects[i].lessons.splice(j,1);W();render()}
function dd(i,j){if(confirm('حذف الملف؟')){S.subjects[i].docs.splice(j,1);W();render()}}
function ds(i){if(confirm('حذف المادة وكل بياناتها؟')){S.subjects.splice(i,1);W();go('home')}}
function sq(i,j){Q={i,j,n:0,sc:0,sel:null};go('quiz')}
function pk(k){const q=S.subjects[Q.i].quizzes[Q.j].qs[Q.n];Q.sel=k;if(k==q.answer)Q.sc++;render()}
function nx(){const z=S.subjects[Q.i].quizzes[Q.j];Q.n++;Q.sel=null;if(Q.n>=z.qs.length){z.score=Q.sc;W()}render()}
function sp(){S.exam=$('#ex').value;S.hours=Math.min(14,Math.max(1,+$('#hr').value||3));W();render()}
function ss(){S.key=$('#k').value.trim();S.model=$('#m').value.trim()||'gemini-2.5-flash';W();msg='تم الحفظ';render();auto()}
function th(){S.theme=S.theme=='dark'?'light':'dark';W();render()}
function wipe(){if(confirm('حذف كل البيانات نهائياً؟')){localStorage.removeItem('bacc');L();go('home')}}
const pt=()=>T.end?Math.max(0,T.end-Date.now()):T.left,fm=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const p1=()=>{if(!T.end)T.end=Date.now()+T.left;render()},p2=()=>{if(T.end){T.left=pt();T.end=0}render()},p3=()=>{T={m:'work',end:0,left:15e5};render()};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},700)}catch(e){}}
function pdone(){beep();navigator.vibrate&&navigator.vibrate([300,150,300]);if(T.m=='work'){const d=new Date().toDateString();if(!S.pn||S.pn.d!=d)S.pn={d,n:0};S.pn.n++;W()}T.m=T.m=='work'?'break':'work';T.end=0;T.left=PM[T.m]*6e4;render()}
setInterval(()=>{if(T.end){const l=pt(),e=$('#pt');if(e)e.textContent=fm(l);document.title=fm(l);if(l<=0)pdone()}},500);

function home(){let h=`<h1>دراسة البكلوريا</h1><p class=sb>ارفع ملف المادة، وكل يومين بيجهّزلك التطبيق اختبار جديد تلقائياً.</p>`+ban();
 if(!S.key)h+=`<div class=m>حط مفتاح Gemini المجاني من الإعدادات حتى يشتغل توليد الأسئلة والملخصات.</div>`;
 S.subjects.forEach((s,i)=>{const p=pend(s),d=dueN(s);h+=`<div class=c><div class=row><b>${E(s.name)}</b><span>${p?`<span class=tag>${p} اختبار</span> `:''}${d?`<span class=tag>${d} بطاقة</span>`:''}</span></div><div class=bar style="margin:8px 0"><i style="width:${prog(s)}%"></i></div><p class=sb style="margin:0 0 6px">إنجاز الدروس ${prog(s)}%</p><button onclick="go('sub',{i:${i},t:'q'})">فتح</button></div>`});
 return h+`<h2>إضافة مادة</h2><div class=c><input id=nm placeholder="اسم المادة، مثلاً: الأحياء"><button onclick="addSub()">إضافة</button></div>`}
function sub(){const s=S.subjects[v.i];if(!s)return'';const t=v.t||'q',i=v.i;
 let h=`<div class=row><h1>${E(s.name)}</h1><button class=g onclick="go('home')">رجوع</button></div><div class=bar><i style="width:${prog(s)}%"></i></div><p class=sb>إنجاز الدروس ${prog(s)}%</p><div class=tabs>`+[['q','اختبارات'],['s','ملخصات'],['c','بطاقات'],['l','دروس'],['f','ملفات']].map(x=>`<button class="${t==x[0]?'':'g'}" onclick="go('sub',{i:${i},t:'${x[0]}'})">${x[1]}</button>`).join('')+'</div>'+ban();
 if(t=='q'){h+=`<p><button onclick="nq(${i},'lesson')">اختبار جديد من الدروس</button>${s.docs.some(d=>d.kind=='exam')?`<button class=g onclick="nq(${i},'exam')">اختبار بأسلوب الدورات السابقة</button>`:''}</p>`;
  if(!s.quizzes.length)h+='<p class=sb>لا يوجد اختبارات بعد. أضف ملفاً من تبويب ملفات.</p>';
  s.quizzes.forEach((q,j)=>h+=`<div class="c row"><div>${new Date(q.d).toLocaleDateString('ar-SY')}${q.k=='exam'?' (دورات)':''}<br><span class=sb>${q.score==null?'لم يُحَل':'العلامة '+q.score+' من '+q.qs.length}</span></div><button onclick="sq(${i},${j})">${q.score==null?'ابدأ':'أعد'}</button></div>`)}
 if(t=='s'){if(!s.docs.length)h+='<p class=sb>أضف ملفاً أولاً.</p>';s.docs.forEach((d,j)=>h+=`<div class=c><b>${E(d.n)}</b>${d.sum?`<div class=pre>${E(d.sum)}</div>`:`<p><button onclick="sm(${i},${j})">لخّص هالملف</button></p>`}</div>`)}
 if(t=='c'){const n=dueN(s);h+=`<p class=sb>${s.cards.length} بطاقة، ${n} للمراجعة الآن</p><p><button ${n?'':'disabled'} onclick="st(${i})">راجع الآن</button><button class=g onclick="gc(${i})">ولّد بطاقات من الدروس</button><button class=g onclick="ac(${i})">أضف بطاقة</button></p>`;s.cards.forEach((c,j)=>h+=`<div class="c row"><div>${E(c.f)}<br><span class=sb>${E(c.b)}</span></div><button class=g onclick="dc(${i},${j})">حذف</button></div>`)}
 if(t=='l'){h+=`<p><button onclick="al(${i})">أضف درس</button><button class=g onclick="xl(${i})">استخرج الدروس من الملف</button></p>`;if(!s.lessons.length)h+='<p class=sb>أضف دروس المادة حتى تتابع تقدّمك.</p>';
  s.lessons.forEach((l,j)=>h+=`<div class="c row"><label><input type=checkbox ${l.done?'checked':''} onchange="tl(${i},${j})"> ${E(l.t)}</label><span>${l.v?`<a href="${E(l.v)}" target=_blank rel=noopener><button class=g>فيديو</button></a>`:''}<button class=g onclick="vd(${i},${j})">${l.v?'تعديل':'رابط فيديو'}</button><button class=g onclick="dl(${i},${j})">حذف</button></span></div>`)}
 if(t=='f'){h+=`<div class=c><b>إضافة ملف (PDF فيه نص، أو TXT)</b><select id=kd><option value=lesson>ملف دروس</option><option value=exam>دورة امتحانية سابقة</option></select><input type=file id=fl accept=".pdf,.txt"><button onclick="addDoc(${i})">إضافة</button></div>`;
  s.docs.forEach((d,j)=>h+=`<div class="c row"><div>${E(d.n)}<br><span class=sb>${d.kind=='exam'?'دورة سابقة':'دروس'}</span></div><button class=g onclick="dd(${i},${j})">حذف</button></div>`);
  h+=`<p><button class=g onclick="ds(${i})">حذف المادة</button></p>`}
 return h}
function quiz(){const z=S.subjects[Q.i].quizzes[Q.j];
 if(Q.n>=z.qs.length)return`<h1>انتهى الاختبار</h1><div class=c><h2>علامتك ${Q.sc} من ${z.qs.length}</h2></div><button onclick="go('sub',{i:${Q.i},t:'q'})">رجوع</button>`;
 const q=z.qs[Q.n];let h=`<div class=row><span class=sb>سؤال ${Q.n+1} من ${z.qs.length}</span><button class=g onclick="go('sub',{i:${Q.i},t:'q'})">خروج</button></div><div class=c><b>${E(q.q)}</b></div>`;
 q.options.forEach((o,k)=>h+=`<button class="o ${Q.sel!==null?(k==q.answer?'ok':k==Q.sel?'bd':''):''}" ${Q.sel!==null?'disabled':''} onclick="pk(${k})">${E(o)}</button>`);
 return h+(Q.sel!==null?`<div class=c>${E(q.explain||'')}</div><button onclick="nx()">${Q.n+1<z.qs.length?'السؤال التالي':'إنهاء'}</button>`:'')}
function study(){const s=S.subjects[C.i],c=s.cards[C.q[0]];
 if(!c)return`<h1>خلصت المراجعة</h1><div class=c>راجعت ${C.r} بطاقة بنجاح.</div><button onclick="go('sub',{i:${C.i},t:'c'})">رجوع</button>`;
 return`<div class=row><span class=sb>باقي ${C.q.length}</span><button class=g onclick="go('sub',{i:${C.i},t:'c'})">خروج</button></div><div class="c card" onclick="C.flip=!C.flip;render()">${E(C.flip?c.b:c.f)}</div>`+(C.flip?`<div class=row><button class=g style="flex:1" onclick="mk(0)">ما عرفتها</button><button style="flex:1" onclick="mk(1)">عرفتها</button></div>`:`<p class=sb style="text-align:center">اضغط على البطاقة لتشوف الجواب</p>`)}
function plan(){const left=S.exam?Math.ceil((new Date(S.exam+'T00:00')-Date.now())/D):null;
 let h='<h1>الخطة</h1>'+ban()+`<div class=c><label>تاريخ امتحان البكلوريا</label><input type=date id=ex value="${E(S.exam)}"><label>ساعات الدراسة باليوم</label><input type=number id=hr min=1 max=14 step=.5 value="${S.hours}"><button onclick="sp()">حفظ</button></div>`;
 if(left!==null)h+=`<div class=c><div class=big>${Math.max(0,left)}</div><p class=sb style="text-align:center">${left>0?'يوم باقي على الامتحان':left==0?'الامتحان اليوم':'انتهى الموعد'}</p><p>${TIPS[Math.floor(Date.now()/D)%TIPS.length]}</p></div>`;
