<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26337a"><title>دفتر البكالوريا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap">
<style>
:root{--bg:#f2f4fb;--c:#fff;--t:#161c3a;--m:#5d6488;--p:#26337a;--hl:#ffe14d;--ok:#1f9d6b;--no:#e5484d;--b:#d9ddf0}
body.d{--bg:#0f1226;--c:#191d3a;--t:#eceefc;--m:#9aa1cf;--p:#8b9bff;--b:#2b3060}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--t);padding:12px 14px calc(78px + env(safe-area-inset-bottom));padding-top:calc(12px + env(safe-area-inset-top))}
h1{font-size:24px;font-weight:900;margin:6px 0 12px}h2{margin:0 0 6px}
.c{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.hl{background:var(--hl);color:#161c3a;border-color:var(--hl)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.k{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--m)}
.k b{display:block;font-size:30px;font-weight:900;color:var(--t);line-height:1.1}
.k:first-child{background:var(--hl);border-color:var(--hl);color:#161c3a}.k:first-child b{color:#161c3a}
input,textarea,select{width:100%;font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:10px;margin:6px 0}
button{font:inherit;font-weight:700;background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;margin:6px 0 0;cursor:pointer}
body.d button{color:#0f1226}.hl button{background:#161c3a;color:#fff}
button.s{background:transparent;color:var(--p);border:1px solid var(--p)}
button.o{display:block;width:100%;text-align:right;background:var(--bg);color:var(--t);border:1px solid var(--b);margin:8px 0}
button:disabled{opacity:.6}
.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--c))}
.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--c))}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q{font-size:19px;line-height:1.9;margin:10px 0}small{color:var(--m);display:block;margin-top:6px}
.hl small{color:#3b3f63}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%}
.bd{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.bd span{background:var(--hl);color:#161c3a;border-radius:12px;padding:6px 10px;text-align:center;font-size:20px}
.bd span small{font-size:11px;color:#161c3a;margin:0}.bd .off{filter:grayscale(1);opacity:.35}
.big{font-size:56px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--m);border-radius:0;margin:0;padding:8px 2px;font-size:11px}
nav button span{display:block;font-size:20px}nav button.on{color:var(--p);box-shadow:inset 0 3px var(--hl)}
body.d nav button{color:var(--m)}body.d nav button.on{color:var(--p)}
</style></head><body>
<div id="app"></div>
<nav>
<button data-t="home" onclick="go('home')"><span>🏠</span>الرئيسية</button>
<button data-t="subs" onclick="go('subs')"><span>📚</span>موادي</button>
<button data-t="quiz" onclick="go('quiz')"><span>📝</span>اختبار</button>
<button data-t="cards" onclick="go('cards')"><span>🃏</span>مراجعة</button>
<button data-t="tools" onclick="go('tools')"><span>⏱</span>أدوات</button>
<button data-t="board" onclick="go('board')"><span>🏆</span>المتصدرون</button>
</nav>
<script>
// ===== إعداد Supabase (اختياري للمتصدرين) =====
const CFG={URL:'',KEY:''}; // ضع رابط المشروع ومفتاح anon هنا
// ==============================================
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('bq'))}catch(e){}
S=S||{name:'',subs:{},pts:0,streak:0,last:'',exam:'',mins:0,lastQ:0,dark:0};
const save=()=>{try{localStorage.setItem('bq',JSON.stringify(S))}catch(e){}};
const D=864e5,day=t=>new Date(t).toISOString().slice(0,10),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const app=$('#app'),theme=()=>document.body.classList.toggle('d',!!S.dark);
function touch(){const t=day(Date.now());if(S.last!==t){S.streak=S.last===day(Date.now()-D)?S.streak+1:1;S.last=t;save()}}
const BAD=[['🔥','٣ أيام متواصلة',()=>S.streak>=3],['📚','أضفت مادة',()=>Object.keys(S.subs).length>0],['⭐','١٠٠ نقطة',()=>S.pts>=100],['🏆','٥٠٠ نقطة',()=>S.pts>=500],['⏱','ساعة دراسة',()=>S.mins>=60]];
const H=()=>({apikey:CFG.KEY,Authorization:'Bearer '+CFG.KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'});
function push(){if(CFG.URL&&S.name)fetch(CFG.URL+'/rest/v1/board?on_conflict=name',{method:'POST',headers:H(),body:JSON.stringify({name:S.name,pts:S.pts,seen:Date.now()})}).catch(()=>{})}
// ===== توليد الأسئلة من النص =====
function parse(text){return text.split(/[.!؟?\n]+/).map(x=>x.trim()).filter(x=>x.length>=30&&x.length<=220).map(t=>{
const w=t.split(/\s+/).map(x=>x.replace(/[،,:;()«»"]/g,'')).filter(x=>x.length>=4).sort((a,b)=>b.length-a.length);
return w.length?{t,a:w[0],box:0,due:0,wrong:0}:null}).filter(Boolean)}
function mk(sub,q){const pool=sh([...new Set(S.subs[sub].s.map(x=>x.a))].filter(w=>w!==q.a));
if(pool.length<3||Math.random()<.3){const t=Math.random()<.5||!pool.length;return{type:'tf',text:t?q.t:q.t.replace(q.a,pool[0]),ans:t,q,sub}}
return{type:'mc',text:q.t.replace(q.a,'_____'),opts:sh([q.a,...pool.slice(0,3)]),ans:q.a,q,sub}}
// ===== الاختبار =====
let Q,tm;
function start(sub,n,lim){let all=[];Object.keys(S.subs).forEach(k=>{if(sub==='all'||sub===k)S.subs[k].s.forEach(q=>all.push([k,q]))});
if(!all.length){alert('أضف مادة أولاً');return go('subs')}
const now=Date.now();all=sh(all).sort((a,b)=>(b[1].wrong-a[1].wrong)||((a[1].due>now)-(b[1].due>now)));
Q={t0:Date.now(),l:all.slice(0,n).map(([k,q])=>mk(k,q)),i:0,sc:0,end:lim?Date.now()+lim*6e4:0};showQ()}
function showQ(){clearInterval(tm);if(Q.i>=Q.l.length)return fin();const q=Q.l[Q.i];
app.innerHTML=`<div class=c><div class=r><span>سؤال ${Q.i+1} من ${Q.l.length}</span><b id=tt></b></div><p class=q>${q.type=='tf'?'صح أم خطأ؟<br>':'أكمل الفراغ:<br>'}${E(q.text)}</p>${q.type=='tf'?`<button class=o onclick="ans(true)">✅ صح</button><button class=o onclick="ans(false)">❌ خطأ</button>`:q.opts.map((o,i)=>`<button class=o onclick="ans(${i})">${E(o)}</button>`).join('')}</div>`;
if(Q.end)tm=setInterval(()=>{const r=Q.end-Date.now();if(r<=0){clearInterval(tm);return fin()}$('#tt').textContent='⏱ '+Math.floor(r/6e4)+':'+String(Math.floor(r/1e3)%60).padStart(2,'0')},500)}
function ans(x){const q=Q.l[Q.i],r=q.q,s=S.subs[q.sub],ok=q.type=='tf'?x===q.ans:q.opts[x]===q.ans;s.tot=(s.tot||0)+1;
if(ok){Q.sc++;S.pts+=10;s.ok=(s.ok||0)+1;r.box=Math.min(r.box+1,4);r.due=Date.now()+[0,1,3,7,14][r.box]*D;r.wrong=0}else{r.wrong=1;r.box=0;r.due=0}
save();clearInterval(tm);document.querySelectorAll('.o').forEach(b=>b.disabled=true);
const f=document.createElement('div');f.className='c '+(ok?'good':'bad');f.innerHTML=(ok?'✅ إجابة صحيحة':'❌ إجابة خاطئة')+`<p>الجملة الصحيحة: ${E(r.t)}</p><button onclick="Q.i++;showQ()">التالي</button>`;app.appendChild(f)}
function fin(){clearInterval(tm);S.lastQ=Date.now();addMin(Math.max(1,Math.round((Date.now()-Q.t0)/6e4)));touch();save();push();const p=Math.round(Q.sc/Q.l.length*100);
app.innerHTML=`<div class="c hl"><h2>${p>=70?'🎉 ممتاز':'💪 تابع المحاولة'}</h2><p>نتيجتك ${Q.sc} من ${Q.l.length} (${p}٪)</p><button onclick="go('home')">الرئيسية</button> <button onclick="go('cards')">راجع أخطاءك</button> <button class=s onclick="window.open('https://wa.me/?text='+encodeURIComponent('حصلت على ${p}٪ في دفتر البكالوريا 💪 تحداني!'))">شارك على واتساب</button></div>`}
// ===== المراجعة =====
let C;
function card(){const h='<h1>دفتر أخطائي</h1>';
if(!C.l.length)return app.innerHTML=h+'<div class=c>لا شيء للمراجعة الآن 🎉 أخطاؤك وبطاقاتك المستحقة ستظهر هنا.</div>';
if(C.i>=C.l.length)return app.innerHTML=h+'<div class="c hl"><h2>انتهت المراجعة ✅</h2></div>';
const[k,q]=C.l[C.i];app.innerHTML=h+`<div class=c><small>${E(k)} — ${C.i+1} من ${C.l.length}</small><p class=q>${E(q.t.replace(q.a,'_____'))}</p><button onclick="this.nextElementSibling.hidden=false;this.hidden=true">أظهر الجواب</button><div hidden><p class=q><b>${E(q.a)}</b></p><button onclick="rate(1)">عرفتها 👍</button> <button class=s onclick="rate(0)">لم أعرفها</button></div></div>`}
function rate(g){const q=C.l[C.i][1];if(g){q.wrong=0;q.box=Math.min(q.box+1,4);q.due=Date.now()+[0,1,3,7,14][q.box]*D;S.pts+=2}else{q.box=0;q.wrong=1}save();C.i++;card()}
// ===== المواد =====
function addSub(){const n=$('#sn').value.trim(),t=$('#st').value;if(!n||!t)return alert('اكتب اسم المادة والنص');const s=parse(t);if(s.length<3)return alert('النص قصير. الصق درساً أطول بجمل كاملة.');
const o=S.subs[n]||{s:[]},have=new Set(o.s.map(x=>x.t));s.forEach(x=>{if(!have.has(x.t))o.s.push(x)});S.subs[n]=o;save();V.subs()}
function delSub(i){const k=Object.keys(S.subs)[i];if(confirm('حذف مادة '+k+'؟')){delete S.subs[k];save();V.subs()}}
// ===== الأدوات =====
let pt;
function pomo(m){clearInterval(pt);const el=$('#pm');if(!m){el.textContent='25:00';return}let r=m*60;
const draw=()=>{const e=$('#pm');if(e)e.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0')};draw();
pt=setInterval(()=>{r--;draw();if(r%60==0)push();if(r<=0){clearInterval(pt);if(m>=25){addMin(m);S.pts+=20;touch();save();push()}try{navigator.vibrate(300)}catch(e){}alert(m>=25?'أحسنت! خذ استراحة 🎉':'يلا نرجع نركّز 💪')}},1000)}
function notif(){if(!('Notification' in window))return alert('جهازك لا يدعم التنبيهات');Notification.requestPermission().then(p=>alert(p=='granted'?'تم. سنذكّرك عند فتح التطبيق إذا حان وقت الاختبار.':'لم يتم السماح بالتنبيهات'))}
const sched=(ks,dl)=>'<ol>'+Array.from({length:Math.min(dl,7)},(_,i)=>`<li>${new Date(Date.now()+i*D).toLocaleDateString('ar-SY',{weekday:'long'})}: ${E(ks[i%ks.length])}</li>`).join('')+'</ol>';
// ===== الشاشات =====
const V={
home(){const ks=Object.keys(S.subs),due=ks.length&&Date.now()-S.lastQ>=2*D,dl=S.exam?Math.ceil((new Date(S.exam)-Date.now())/D):null;
app.innerHTML=`<h1>أهلاً ${E(S.name||'يا بطل')} 👋</h1><div class=g><div class=k><b>${S.streak}</b>يوم متواصل 🔥</div><div class=k><b>${S.pts}</b>نقطة ⭐</div><div class=k><b>${dl!==null&&dl>=0?dl:'—'}</b>يوم للامتحان</div></div>
${due?`<div class="c hl"><b>📝 اختبارك الدوري جاهز!</b><small>مرّ يومان على آخر اختبار.</small><button onclick="start('all',10)">ابدأ الآن</button></div>`:''}
<div class=c><b>سؤال اليوم</b><small>سؤال واحد يحافظ على سلسلة أيامك.</small><button onclick="start('all',1)">ابدأ</button></div>
${chart()}
<div class=c><b>الشارات</b><div class=bd>${BAD.map(b=>`<span class="${b[2]()?'':'off'}">${b[0]}<small>${b[1]}</small></span>`).join('')}</div></div>
${ks.length?'':'<div class=c>ابدأ بإضافة مادة من تبويب «موادي».</div>'}`},
subs(){const ks=Object.keys(S.subs);
app.innerHTML=`<h1>موادي</h1><div class=c><b>إضافة مادة</b><input id=sn placeholder="اسم المادة (مثلاً: أحياء)"><textarea id=st rows=6 placeholder="الصق نص الدرس هنا أو اختر ملفاً نصياً"></textarea><input type=file id=sf accept=".txt,.pdf,text/plain,application/pdf"><button onclick="addSub()">حفظ وتوليد الأسئلة</button><small>تُولَّد الأسئلة من الجمل الكاملة، فكلما كان النص أوضح كانت الأسئلة أفضل.</small></div>
${ks.map((k,i)=>{const s=S.subs[k],a=s.tot?Math.round(100*(s.ok||0)/s.tot):null;return`<div class=c><div class=r><b>${E(k)}</b><span>${s.s.length} سؤال</span></div><div class=bar><i style="width:${a||0}%;background:${a===null?'var(--b)':a>=70?'var(--ok)':a>=40?'#f59e0b':'var(--no)'}"></i></div><small>${a===null?'لم تُختبر بعد':'الإتقان '+a+'٪'+(a<50?' — نقطة ضعف':'')}</small><button onclick="start(Object.keys(S.subs)[${i}],10)">اختبر</button> <button class=s onclick="summ(${i})">ملخص وملاحظات</button> <button class=s onclick="delSub(${i})">حذف</button></div>`}).join('')}`;
$('#sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;let t;try{t=/\.pdf$/i.test(f.name)?await readPdf(f):await f.text()}catch(x){return alert('تعذّرت قراءة الملف (تحتاج إنترنت للـ PDF). جرّب نسخ النص.')}$('#st').value=t;if(!$('#sn').value)$('#sn').value=f.name.replace(/\.\w+$/,'')}},
quiz(){const ks=Object.keys(S.subs);app.innerHTML=`<h1>اختبار</h1><div class=c><select id=qs><option value=all>كل المواد</option>${ks.map((k,i)=>`<option value="${i}">${E(k)}</option>`).join('')}</select>
<button onclick="start(qv(),10)">اختبار سريع (١٠ أسئلة)</button><button class=s onclick="start(qv(),20,30)">امتحان محاكي (٢٠ سؤالاً / ٣٠ دقيقة)</button><small>الامتحان المحاكي بعدّاد تنازلي، ويبدأ بأسئلة أخطائك.</small></div>`},
cards(){let l=[];Object.keys(S.subs).forEach(k=>S.subs[k].s.forEach(q=>{if(q.wrong||(q.box>0&&q.due<=Date.now()))l.push([k,q])}));C={l:sh(l),i:0};card()},
tools(){const ks=Object.keys(S.subs),dl=S.exam?Math.ceil((new Date(S.exam)-Date.now())/D):0;
app.innerHTML=`<h1>أدوات</h1><div class=c><b>مؤقّت التركيز</b><div class=big id=pm>25:00</div><button onclick="pomo(25)">ابدأ ٢٥ دقيقة</button> <button class=s onclick="pomo(5)">استراحة ٥</button> <button class=s onclick="pomo(0)">إيقاف</button><small>مجموع دراستك: ${S.mins} دقيقة</small><small>هدفك اليومي (دقيقة)</small><input type=number value="${S.goal||60}" onchange="S.goal=+this.value||60;save()"></div>
<div class=c><b>موعد الامتحان</b><input type=date id=ex value="${S.exam}" onchange="S.exam=this.value;save();V.tools()">${dl>0&&ks.length?`<p>باقي ${dl} يوماً. جدولك المقترح:</p>${sched(ks,dl)}`:''}</div>
<div class=c><button onclick="S.dark=!S.dark;save();theme()">🌓 الوضع الليلي</button> <button class=s onclick="notif()">🔔 تفعيل التنبيهات</button></div>`},
board(){app.innerHTML=`<h1>المتصدرون</h1><div class=c><input id=nm placeholder="اسمك" value="${E(S.name)}"><button onclick="S.name=$('#nm').value.trim();save();push();V.board()">حفظ الاسم</button></div>${CFG.URL?'<div class=c id=rm></div>':''}<div class=c id=lb>${CFG.URL?'جارٍ التحميل…':'المتصدرون وغرفة الدراسة والحساب تحتاج ربط Supabase، ضع بياناته في أول الملف.'}</div>${CFG.URL?acct():''}`;
if(CFG.URL)fetch(`${CFG.URL}/rest/v1/board?select=name,pts,seen&order=pts.desc&limit=30`,{headers:H()}).then(r=>r.json()).then(d=>{const on=d.filter(x=>x.seen>Date.now()-3e5);$('#rm').innerHTML='<b>🟢 غرفة الدراسة</b><br>'+(on.length?on.map(x=>E(x.name)).join('، ')+' يدرسون الآن':'لا أحد الآن، كن أول من يبدأ');$('#lb').innerHTML=d.slice(0,10).map((x,i)=>`<div class=r><span>${i+1}. ${E(x.name)}</span><b>${x.pts} ⭐</b></div>`).join('')||'لا أحد بعد'}).catch(()=>$('#lb').textContent='تعذّر الاتصال بالسيرفر')}};
const addMin=m=>{S.log=S.log||{};const t=day(Date.now());S.log[t]=(S.log[t]||0)+m;S.mins+=m};
const chart=()=>{const g=S.goal||60;let h='';for(let i=6;i>=0;i--){const d=day(Date.now()-i*D),v=(S.log||{})[d]||0;h+=`<div style="flex:1;text-align:center"><div style="height:60px;display:flex;align-items:flex-end"><i style="display:block;width:100%;height:${Math.min(100,v/g*100)}%;min-height:3px;background:${v>=g?'var(--ok)':'var(--hl)'};border-radius:4px"></i></div><small>${v}د</small></div>`}return`<div class=c><b>دراستك هذا الأسبوع</b><small>الهدف اليومي ${g} دقيقة (الأخضر = تحقق)</small><div style="display:flex;gap:6px;margin-top:8px">${h}</div></div>`};
function summ(i){const k=Object.keys(S.subs)[i],s=S.subs[k],f={};s.s.forEach(q=>q.t.split(/\s+/).forEach(w=>{if(w.length>3)f[w]=(f[w]||0)+1}));
const top=s.s.map((q,j)=>{const w=q.t.split(/\s+/);return[w.reduce((a,x)=>a+(f[x]||0),0)/w.length,j]}).sort((a,b)=>b[0]-a[0]).slice(0,6).map(x=>x[1]).sort((a,b)=>a-b);
app.innerHTML=`<h1>ملخص ${E(k)}</h1><div class=c><small>أهم الجمل في الدرس:</small><ul>${top.map(j=>`<li>${E(s.s[j].t)}</li>`).join('')}</ul></div><div class=c><b>ملاحظاتي</b><textarea id=nt rows=6 oninput="S.subs[Object.keys(S.subs)[${i}]].note=this.value;save()">${E(s.note||'')}</textarea></div><button onclick="go('subs')">رجوع</button>`}
async function readPdf(f){await new Promise((ok,no)=>{if(window.pdfjsLib)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=d.numPages;i++){const p=await(await d.getPage(i)).getTextContent();t+=p.items.map(x=>x.str).join(' ')+'\n'}return t}

async function auth(up){const e=$('#em').value.trim(),p=$('#pw').value;if(!e||p.length<6)return alert('اكتب بريداً وكلمة سر (٦ أحرف على الأقل)');
try{const r=await fetch(CFG.URL+(up?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:CFG.KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}),d=await r.json();
if(!d.access_token)return alert(d.msg||d.error_description||'تعذّر الدخول. إن أنشأت حساباً فتحقق من بريدك أولاً.');
S.tok=d.access_token;S.uid=d.user.id;S.mail=e;save();V.board()}catch(x){alert('تعذّر الاتصال')}}
async function cloud(up){const h={apikey:CFG.KEY,Authorization:'Bearer '+S.tok,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'};
try{if(up){const{tok,uid,mail,...d}=S,r=await fetch(CFG.URL+'/rest/v1/saves?on_conflict=uid',{method:'POST',headers:h,body:JSON.stringify({uid:S.uid,data:d})});alert(r.ok?'تم الحفظ ☁️':'فشل الحفظ، سجّل الدخول من جديد (تنتهي الجلسة بعد ساعة)')}
else{const r=await fetch(CFG.URL+'/rest/v1/saves?uid=eq.'+S.uid+'&select=data',{headers:h}),d=await r.json();if(!d[0])return alert('لا توجد نسخة محفوظة أو انتهت الجلسة');S=Object.assign(d[0].data,{tok:S.tok,uid:S.uid,mail:S.mail});save();alert('تم الاسترجاع ✅');go('home')}}catch(x){alert('تعذّر الاتصال')}}
